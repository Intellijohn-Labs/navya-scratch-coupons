<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1430">
<title>Live draw · Genuine Draw</title>
<meta name="description" content="A provably fair lucky draw. Watch the winners being picked and check the result yourself.">
<link rel="icon" href="/img/platform-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #0B1430; --navy-2: #14213D; --gold: #E0A33A; --gold-2: #F7CF6B; --gold-3: #FFE9A8; --muted: #8A96B4; --green: #34D399; --red: #F87171; --row: 64px; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { font-family: 'Albert Sans', system-ui, sans-serif; color: #fff; background: radial-gradient(90% 70% at 50% 0%, #1E3166, var(--navy) 70%) fixed, var(--navy); min-height: 100vh; }
a { color: var(--gold-2); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px max(16px, calc((100% - 1100px) / 2)); }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 900; font-size: 18px; }
.brand img { width: 34px; height: 34px; }
.top nav a { color: rgba(255, 255, 255, .75); text-decoration: none; font-weight: 700; font-size: 14px; margin-left: 16px; }
.wrap { width: min(1100px, 100% - 32px); margin: 0 auto; padding-bottom: 70px; }
.hero { text-align: center; padding: 10px 0 4px; }
.shop { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); font-weight: 800; }
.shop .lg { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; color: var(--navy); font-weight: 900; }
.shop .lg img { max-width: 100%; max-height: 100%; object-fit: contain; }
h1 { font-family: 'Fraunces', serif; font-size: clamp(30px, 5.5vw, 56px); line-height: 1.05; margin: 14px 0 8px; letter-spacing: -.02em; }
.sub { color: rgba(255, 255, 255, .7); margin: 0; }
.badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 14px; border-radius: 99px; font-weight: 800; font-size: 13px; letter-spacing: .04em; }
.badge.sealed { background: rgba(247, 207, 107, .14); color: var(--gold-2); border: 1px solid rgba(247, 207, 107, .35); }
.badge.drawn { background: rgba(52, 211, 153, .14); color: var(--green); border: 1px solid rgba(52, 211, 153, .35); }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* the machine: names reel + status */
.machine { margin-top: 26px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 22px; align-items: stretch; }
.reel { position: relative; height: calc(var(--row) * 7); border-radius: 26px; overflow: hidden;
  background: linear-gradient(180deg, #0A1230, #121F48 50%, #0A1230); border: 2px solid rgba(247, 207, 107, .35);
  box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .7), inset 0 0 60px rgba(0, 0, 0, .55); }
.reel::before, .reel::after { content: ''; position: absolute; left: 0; right: 0; height: calc(var(--row) * 2.4); z-index: 2; pointer-events: none; }
.reel::before { top: 0; background: linear-gradient(#0A1230, rgba(10, 18, 48, 0)); }
.reel::after { bottom: 0; background: linear-gradient(rgba(10, 18, 48, 0), #0A1230); }
.reel .band { position: absolute; left: 10px; right: 10px; top: calc(var(--row) * 3); height: var(--row); border-radius: 16px; z-index: 1;
  border: 2px solid var(--gold-2); background: rgba(247, 207, 107, .1); box-shadow: 0 0 40px rgba(247, 207, 107, .25); }
.reel .band::before, .reel .band::after { content: ''; position: absolute; top: 50%; width: 0; height: 0; border: 10px solid transparent; transform: translateY(-50%); }
.reel .band::before { left: -14px; border-left-color: var(--gold-2); }
.reel .band::after { right: -14px; border-right-color: var(--gold-2); }
.reel .row { position: absolute; left: 0; right: 0; top: 0; height: var(--row); display: flex; align-items: center; gap: 16px; padding: 0 44px; transform-origin: 50% 50%; will-change: transform; white-space: nowrap; }
.reel .row .c { font: 700 17px 'IBM Plex Mono', monospace; letter-spacing: .06em; color: var(--gold-3); flex: none; }
.reel .row .n { font-weight: 800; font-size: 19px; overflow: hidden; text-overflow: ellipsis; }
.reel .row .a { margin-left: auto; color: var(--muted); font-size: 14px; flex: none; }
.reel.flash .band { animation: flash .9s ease; }
@keyframes flash { 0% { background: rgba(247, 207, 107, .6); box-shadow: 0 0 90px rgba(247, 207, 107, .9); } 100% { background: rgba(247, 207, 107, .1); } }
.status { border-radius: 26px; padding: 24px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.count { font: 700 clamp(46px, 8vw, 76px) 'IBM Plex Mono', monospace; color: var(--gold-2); letter-spacing: .04em; line-height: 1; }
.shuffle { font-weight: 800; color: rgba(255, 255, 255, .85); }
.now { text-align: center; }
.now small { color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-weight: 800; font-size: 12px; }
.now .pz { font-family: 'Fraunces', serif; font-size: clamp(26px, 4vw, 40px); color: var(--gold-2); margin: 6px 0; }
.now .nm { font-size: 22px; font-weight: 800; }
.now .cd { font: 700 16px 'IBM Plex Mono', monospace; color: var(--gold-3); letter-spacing: .08em; }
.now.pop { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: none; opacity: 1; } }
.mono { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; word-break: break-all; color: var(--gold-3); }
.muted { color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

/* prizes + winners */
.prize-list { display: grid; gap: 8px; margin-top: 12px; }
.prize { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); }
.rank { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: var(--navy); background: linear-gradient(135deg, var(--gold-3), var(--gold)); }
.winners { display: grid; gap: 10px; }
.win { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(247, 207, 107, .25); }
.win.new { animation: slideIn .6s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes slideIn { from { opacity: 0; transform: translateY(-14px) scale(.97); } to { opacity: 1; transform: none; } }
.win .code { font: 700 18px 'IBM Plex Mono', monospace; letter-spacing: .08em; }
.win .who { color: rgba(255, 255, 255, .75); font-size: 15px; font-weight: 700; }
.win .who span { color: var(--muted); font-weight: 500; }
.win .pz { text-align: right; font-weight: 800; color: var(--gold-2); }
.win .pz small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.win.forfeited { border-color: rgba(248, 113, 113, .3); }
.win.forfeited .code { text-decoration: line-through; color: rgba(255, 255, 255, .45); }
.win.backup { border-style: dashed; border-color: rgba(255, 255, 255, .18); }
.grid-wins { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.grid-wins .win { grid-template-columns: 1fr; padding: 10px 12px; }
.grid-wins .win .pz { text-align: left; }
.section-title { font-family: 'Fraunces', serif; font-size: 26px; margin: 40px 0 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 14px; font: inherit; font-weight: 800; cursor: pointer; border: 0; text-decoration: none; }
.btn.gold { background: linear-gradient(135deg, var(--gold-3), var(--gold-2) 35%, var(--gold)); color: var(--navy); }
.btn.ghost { background: rgba(255, 255, 255, .08); color: #fff; border: 1px solid rgba(255, 255, 255, .2); }
.btn[disabled] { opacity: .6; cursor: default; }
.row-flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* proof */
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08); }
.step .n { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; background: rgba(247, 207, 107, .15); color: var(--gold-2); }
.step.ok .n { background: rgba(52, 211, 153, .2); color: var(--green); }
.step.bad .n { background: rgba(248, 113, 113, .2); color: var(--red); }
.step b { display: block; margin-bottom: 4px; }
.step p { margin: 0 0 6px; color: rgba(255, 255, 255, .7); font-size: 14.5px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.files a { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .06); text-decoration: none; }
.progress { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 12px; display: none; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-2), var(--green)); transition: width .2s; }
.result { margin-top: 14px; padding: 14px 16px; border-radius: 16px; font-weight: 800; display: none; }
.result.ok { display: block; background: rgba(52, 211, 153, .12); color: var(--green); border: 1px solid rgba(52, 211, 153, .35); }
.result.bad { display: block; background: rgba(248, 113, 113, .12); color: var(--red); border: 1px solid rgba(248, 113, 113, .35); }
.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 16px; }
.err { text-align: center; padding: 80px 16px; }
@media (max-width: 820px) {
  :root { --row: 54px; }
  .machine { grid-template-columns: 1fr; }
  .reel .row { padding: 0 18px; gap: 10px; }
  .reel .row .c { font-size: 14px; } .reel .row .n { font-size: 16px; } .reel .row .a { display: none; }
  .win { grid-template-columns: 36px 1fr; }
  .win .pz { grid-column: 2; text-align: left; }
  .top nav a:first-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/img/platform-icon.svg" alt=""><span>Genuine Draw</span></a>
    <nav><a href="/winners">All winners</a><a href="/verify">Verify a coupon</a></nav>
  </header>
  <main class="wrap" id="app"><div class="err">Loading the draw…</div></main>
  <footer class="foot">Every draw on Genuine Draw uses public randomness from drand (League of Entropy) and can be checked by anyone.</footer>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtCode = c => c && c.length === 8 ? c.slice(0, 4) + '-' + c.slice(4) : c;
  const toDate = s => s ? new Date(s.length > 10 && !s.endsWith('Z') ? s.replace(' ', 'T') + 'Z' : (s.length === 10 ? s + 'T00:00:00' : s)) : null;
  const fmtDate = s => s ? toDate(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const fmtTime = s => s ? toDate(s).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' }) : '';
  const num = n => Number(n).toLocaleString('en-IN');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const id = parseInt(location.pathname.split('/')[2], 10);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let D = null, poll = null, sample = [], playing = false;

  // ---------------- the names reel
  const reel = { pos: 0, speed: 4, target: null, el: null, rows: [], over: new Map(), raf: 0, last: 0, mode: 'idle', tween: null };
  const ROWS = 9;   // drawn rows (7 visible + 1 above + 1 below)
  function mountReel() {
    reel.el = $('#reel');
    reel.el.innerHTML = '<div class="band"></div>' + Array.from({ length: ROWS }, () => '<div class="row"><span class="c"></span><span class="n"></span><span class="a"></span></div>').join('');
    reel.rows = [...reel.el.querySelectorAll('.row')];
    cancelAnimationFrame(reel.raf); reel.last = performance.now(); reel.raf = requestAnimationFrame(tick);
  }
  const itemAt = i => reel.over.get(i) || (sample.length ? sample[((i % sample.length) + sample.length) % sample.length] : { code: '········', name: '' });
  function tick(now) {
    const dt = Math.min(.05, (now - reel.last) / 1000); reel.last = now;
    if (reel.tween) {
      const t = Math.min(1, (now - reel.tween.start) / reel.tween.ms), e = 1 - Math.pow(1 - t, 3);
      reel.pos = reel.tween.from + (reel.tween.to - reel.tween.from) * e;
      if (t >= 1) { const done = reel.tween.done; reel.tween = null; reel.speed = 0; done && done(); }
    } else reel.pos += reel.speed * dt;
    const h = reel.el.clientHeight / 7, base = Math.floor(reel.pos), frac = reel.pos - base;
    for (let j = 0; j < ROWS; j++) {
      const idx = base + j - 4, it = itemAt(idx), r = reel.rows[j];
      const y = (j - 1 - frac) * h;   // row j-1 sits at slot j-1; the centre slot is 3
      const dist = Math.abs(j - 1 - frac - 3);
      r.style.transform = `translateY(${y}px) scale(${1 + Math.max(0, .05 - dist * .025)})`;
      r.style.opacity = String(Math.max(.25, 1 - dist * .2));
      if (r._i !== idx) { r._i = idx; r.children[0].textContent = fmtCode(it.code); r.children[1].textContent = it.name || ''; r.children[2].textContent = it.area || ''; }
    }
    reel.raf = requestAnimationFrame(tick);
  }
  // Glide to a stop with `item` in the centre band.
  // The item in the centre band is the one at index `pos`, so landing = easing pos to a chosen index.
  // Distance is set so the ease-out starts at the reel's current speed (no visible jerk).
  function landOn(item, ms) {
    return new Promise(res => {
      const v = Math.max(reel.speed, 8), target = Math.floor(reel.pos) + Math.max(6, Math.round(v * ms / 1000 / 3));
      reel.over.set(target, item);
      reel.tween = { from: reel.pos, to: target, start: performance.now(), ms, done: res };
    });
  }

  // ---------------- loading
  async function load() {
    const r = await fetch('/api/draws/' + id).catch(() => null);
    if (!r || !r.ok) { $('#app').innerHTML = '<div class="err"><h1>Draw not found</h1><p class="sub">Check the link and try again.</p></div>'; return; }
    const prev = D && D.status;
    D = await r.json();
    document.title = `${D.campaign.name} · Live draw · Genuine Draw`;
    if (!sample.length) sample = await fetch(`/api/draws/${id}/reel`).then(x => x.json()).catch(() => []);
    if (!prev) render();
    else if (prev === 'sealed' && D.status === 'drawn') render(true);
    if (D.status === 'sealed') { clearTimeout(poll); poll = setTimeout(load, 3000); }
  }
  const head = () => `<section class="hero">
      <span class="shop"><span class="lg">${D.shop.logo ? `<img src="${esc(D.shop.logo)}" alt="">` : esc(D.shop.name[0])}</span>${esc(D.shop.name)}</span>
      <h1>${esc(D.campaign.name)}</h1>
      <p class="sub">${num(D.entries_count)} entries · draw date ${fmtDate(D.campaign.draw_on)}</p>
      <span class="badge ${D.status}" id="badge"><i></i>${D.status === 'sealed' ? 'ENTRIES SEALED · DRAWING' : 'DRAW COMPLETE'}</span>
    </section>`;
  const prizeHtml = () => D.prizes.map(p => `<div class="prize"><span class="rank">${p.rank}</span><div><b>${esc(p.name)}</b>${p.quantity > 1 ? ` <span class="muted">× ${p.quantity}</span>` : ''}</div></div>`).join('');
  const sampleNote = () => sample.length < D.entries_count ? `<p class="note">The reel shows a random selection of ${num(sample.length)} entries. The draw itself uses all ${num(D.entries_count)}.</p>` : '';

  function render(justDrawn) {
    if (D.status === 'sealed') {
      $('#app').innerHTML = head() + `<section class="machine"><div class="reel" id="reel"></div>
        <div class="status" id="status"><div class="muted">Winners will be picked in</div><div class="count" id="count">--:--</div>
          <div class="shuffle">Shuffling ${num(D.entries_count)} entries…</div>
          <p class="sub" style="font-size:14px">The entry list was sealed at ${fmtTime(D.sealed_at)}. The winners depend on public random number <b>#${D.beacon.round}</b>, which nobody can know until ${fmtTime(D.beacon.round_time)}.</p>
          <p class="note">Sealed list fingerprint<br><span class="mono">${esc(D.entries_hash)}</span></p></div></section>
        ${sampleNote()}<h2 class="section-title">Prizes</h2><div class="prize-list">${prizeHtml()}</div>`;
      mountReel();
      countdown();
      return;
    }
    $('#app').innerHTML = head() + `<section class="machine"><div class="reel" id="reel"></div>
        <div class="status" id="status"></div></section>${sampleNote()}
      <div class="row-flex" style="margin:34px 0 14px"><h2 class="section-title" style="margin:0">Winners</h2><button class="btn ghost" id="replay" type="button">↺ Watch the draw again</button></div>
      <div id="winners"></div><div id="backups"></div>
      ${proofHtml()}`;
    mountReel();
    $('#replay').onclick = () => reveal(true);
    $('#verifyBtn').onclick = verify;
    const fresh = justDrawn || (D.drawn_at && Date.now() - toDate(D.drawn_at).getTime() < 10 * 60000);
    reveal(fresh && !reduce);
  }

  // Countdown: the reel speeds up over the last 10 seconds.
  function countdown() {
    const el = $('#count'); if (!el || D.status !== 'sealed') return;
    const ms = new Date(D.beacon.round_time).getTime() - Date.now();
    el.textContent = ms > 0 ? `${String(Math.floor(ms / 60000)).padStart(2, '0')}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}` : 'Drawing…';
    reel.speed = ms > 10000 ? 5 : ms > 0 ? 5 + (10000 - ms) / 10000 * 25 : 30;
    setTimeout(countdown, 100);
  }

  // ---------------- reveal
  const label = w => w.prize_name || 'Backup ' + (w.pick_no - D.winners.filter(x => !x.backup).length);
  function card(w, isNew) {
    const note = w.status === 'forfeited' ? 'Not collected · passed to backup' : w.replaces_id ? 'Backup winner' : w.collected ? 'Collected ✓' : w.backup ? 'Reserve' : `Rank ${w.prize_rank}`;
    return `<div class="win ${isNew ? 'new' : ''} ${w.status === 'forfeited' ? 'forfeited' : ''} ${w.backup && w.status === 'standby' ? 'backup' : ''}"><span class="rank">${w.prize_rank || '·'}</span>
      <div><div class="code">${esc(fmtCode(w.code))}</div><div class="who">${esc(w.name)} <span>${esc(w.area ? '· ' + w.area : '')}</span></div></div>
      <div class="pz">${esc(label(w))}<small>${esc(note)}</small></div></div>`;
  }
  function showNow(w) {
    $('#status').innerHTML = w ? `<div class="now pop"><small>${esc(w.backup ? 'Backup winner' : 'Winner')}</small><div class="pz">${esc(label(w))}</div><div class="nm">${esc(w.name)}</div><div class="cd">${esc(fmtCode(w.code))}</div></div>`
      : `<div class="now"><small>Draw complete</small><div class="pz">${num(D.winners.filter(x => !x.backup || x.status === 'won').length)} winners</div><div class="sub">from ${num(D.entries_count)} entries</div></div>`;
  }
  async function reveal(animate) {
    const winners = D.winners.filter(w => !w.backup || w.status === 'won'), backups = D.winners.filter(w => w.backup && w.status === 'standby');
    const list = $('#winners'), bl = $('#backups');
    if (!animate) {
      list.innerHTML = `<div class="winners">${winners.map(w => card(w)).join('')}</div>`;
      bl.innerHTML = backups.length ? `<h2 class="section-title">Backup winners</h2><p class="sub" style="margin-bottom:12px">If a winner doesn't collect their prize within ${D.campaign.claim_days} days, it goes to the next backup in this order.</p><div class="winners">${backups.map(w => card(w)).join('')}</div>` : '';
      reel.speed = 0; showNow(null);
      return;
    }
    if (playing) return; playing = true;
    $('#replay').disabled = true;
    list.innerHTML = '<div class="winners" id="wl"></div>'; bl.innerHTML = '';
    // Big prize lists: the smaller prizes appear together, the top ten are drawn one by one.
    const order = [...winners].reverse(), slow = order.slice(-10), quick = order.slice(0, -10);
    if (quick.length) {
      reel.speed = 30; await sleep(1500);
      $('#wl').insertAdjacentHTML('afterbegin', `<div class="grid-wins">${quick.map(w => card(w, true)).join('')}</div>`);
      showNow(null);
    }
    for (const w of slow) {
      $('#status').innerHTML = `<div class="now"><small>Drawing</small><div class="pz">${esc(label(w))}</div><div class="sub">…</div></div>`;
      reel.over.clear(); reel.tween = null; reel.speed = 30;
      await sleep(1100);
      await landOn(w, 2600);
      reel.el.classList.remove('flash'); void reel.el.offsetWidth; reel.el.classList.add('flash');
      showNow(w);
      $('#wl').insertAdjacentHTML('afterbegin', card(w, true));
      await sleep(1700);
    }
    if (backups.length) bl.innerHTML = `<h2 class="section-title">Backup winners</h2><p class="sub" style="margin-bottom:12px">If a winner doesn't collect their prize within ${D.campaign.claim_days} days, it goes to the next backup in this order.</p><div class="winners">${backups.map(w => card(w, true)).join('')}</div>`;
    reel.speed = 0; showNow(null);   // the reel stays on the first-prize winner
    playing = false; $('#replay').disabled = false;
  }

  // ---------------- proof
  function proofHtml() {
    const files = D.chunks.map((c, i) => `<a href="${esc(c.url)}" target="_blank" rel="noopener">${D.chunks.length > 1 ? `Part ${i + 1} · ` : ''}${num(c.lines)} entries</a>`).join('');
    const rule = D.algo === 2
      ? 'For pick k = 0, 1, 2…: take SHA-256( seed + ":" + k ) as a number and divide by the entries left; the remainder is the position of the next winner, and the last entry in the list moves into that spot. If that person has already won, the pick is set aside. Prizes are filled from rank 1 down, then the backups.'
      : 'For pick k = 0, 1, 2…: take SHA-256( seed + ":" + k ) as a number, divide by the entries left, and the remainder is the position of the next winner in the list. If that person has already won, the pick is set aside. Prizes are filled from rank 1 down, then the backups.';
    const fp = D.algo === 2 ? (D.chunks.length > 1 ? `The list is in ${D.chunks.length} parts of up to 50,000 entries. Each part has its own SHA-256, and the fingerprint is the SHA-256 of those, one per line:` : 'The fingerprint is the SHA-256 of the SHA-256 of the list:') : 'Its SHA-256 fingerprint:';
    return `<h2 class="section-title">Check it yourself</h2>
      <p class="sub" style="margin-bottom:16px">This draw can be re-run by anyone. Press the button and your own browser repeats every step and compares the result.</p>
      <div class="steps" id="proof">
        <div class="step" data-s="1"><span class="n">1</span><div><b>The entry list was sealed</b><p>${num(D.entries_count)} entries were frozen at ${fmtTime(D.sealed_at)}, before anyone could know the random number. ${fp}</p><div class="mono">${esc(D.entries_hash)}</div><p style="margin-top:8px">Download the list. Each line is an entry number and a private tag for the person (so one person can only win once):</p><div class="files">${files}</div></div></div>
        <div class="step" data-s="2"><span class="n">2</span><div><b>A public random number was used</b><p>drand round #${D.beacon.round}, published at ${fmtTime(D.beacon.round_time)} by the League of Entropy (Cloudflare, universities and others). Nobody can predict or change it.</p><div class="mono">${esc(D.beacon.randomness)}</div><p style="margin-top:8px"><a href="${esc(D.beacon.url)}" target="_blank" rel="noopener">See this round on drand</a></p></div></div>
        <div class="step" data-s="3"><span class="n">3</span><div><b>Both were combined into the seed</b><p>seed = SHA-256( fingerprint + ":" + random number )</p><div class="mono">${esc(D.seed)}</div></div></div>
        <div class="step" data-s="4"><span class="n">4</span><div><b>Winners were picked by a fixed rule</b><p>${rule}</p></div></div>
      </div>
      <div style="margin-top:16px"><button class="btn gold" id="verifyBtn" type="button">Verify this draw in my browser</button></div>
      <div class="progress" id="prog"><i></i></div>
      <div class="result" id="verifyOut"></div>`;
  }
  const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', typeof s === 'string' ? new TextEncoder().encode(s) : s))].map(b => b.toString(16).padStart(2, '0')).join('');
  async function verify() {
    const out = $('#verifyOut'), btn = $('#verifyBtn'), prog = $('#prog'), bar = prog.firstElementChild;
    const mark = (n, ok) => document.querySelector(`.step[data-s="${n}"]`).classList.add(ok ? 'ok' : 'bad');
    document.querySelectorAll('.step').forEach(s => s.classList.remove('ok', 'bad'));
    out.className = 'result'; btn.disabled = true; prog.style.display = 'block'; bar.style.width = '0';
    try {
      // 1. download every part and check the fingerprint
      const lines = [], hashes = [];
      for (let i = 0; i < D.chunks.length; i++) {
        btn.textContent = `Checking the entry list… ${num(lines.length)} of ${num(D.entries_count)}`;
        const text = await (await fetch(D.chunks[i].url)).text();
        const h = await sha(text); hashes.push(h);
        if (h !== D.chunks[i].hash) throw new Error(`Part ${i + 1} of the list does not match`);
        for (const l of text.split('\n')) lines.push(l);
        bar.style.width = `${Math.round((i + 1) / D.chunks.length * 70)}%`;
      }
      const fp = D.algo === 2 ? await sha(hashes.join('\n')) : hashes[0];
      const ok1 = fp === D.entries_hash && lines.length === D.entries_count; mark(1, ok1);
      // 2. the random number, straight from drand
      btn.textContent = 'Checking the random number…';
      let ok2 = true, note = '';
      try { const b = await (await fetch(`https://drand.cloudflare.com/public/${D.beacon.round}`)).json(); ok2 = b.randomness === D.beacon.randomness; }
      catch { note = ' (drand could not be reached from this browser, so the published number was used)'; }
      mark(2, ok2); bar.style.width = '80%';
      // 3. seed
      const seed = await sha(`${D.entries_hash}:${D.beacon.randomness}`); const ok3 = seed === D.seed; mark(3, ok3);
      // 4. re-run the picks
      btn.textContent = 'Re-running the draw…';
      const need = D.winners.length, seen = new Set(), picks = [];
      if (D.algo === 2) {
        const order = new Int32Array(lines.length); for (let i = 0; i < order.length; i++) order[i] = i;
        let left = lines.length;
        for (let k = 0; picks.length < need && left > 0; k++) {
          const r = Number(BigInt('0x' + await sha(`${seed}:${k}`)) % BigInt(left));
          const line = lines[order[r]]; order[r] = order[left - 1]; left--;
          const c = line.indexOf(','), code = line.slice(0, c), tag = line.slice(c + 1);
          if (!seen.has(tag)) { seen.add(tag); picks.push(code); }
        }
      } else {
        const pool = lines.map(l => { const [code, tag] = l.split(','); return { code, tag }; });
        for (let k = 0; picks.length < need && pool.length; k++) {
          const [e] = pool.splice(Number(BigInt('0x' + await sha(`${seed}:${k}`)) % BigInt(pool.length)), 1);
          if (!seen.has(e.tag)) { seen.add(e.tag); picks.push(e.code); }
        }
      }
      const drawn = [...D.winners].sort((a, b) => a.pick_no - b.pick_no).map(w => w.code);
      const ok4 = JSON.stringify(picks) === JSON.stringify(drawn); mark(4, ok4); bar.style.width = '100%';
      const all = ok1 && ok2 && ok3 && ok4;
      out.className = 'result ' + (all ? 'ok' : 'bad');
      out.textContent = all ? `✓ Verified: your browser checked all ${num(D.entries_count)} entries and picked exactly the same ${need} winners in the same order${note}.` : '✗ Something did not match. Please contact Genuine Draw.';
    } catch (e) { out.className = 'result bad'; out.textContent = 'Could not complete the check: ' + e.message; }
    btn.disabled = false; btn.textContent = 'Verify this draw in my browser';
  }
  load();
})();
</script>
