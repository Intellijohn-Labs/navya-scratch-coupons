<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print coupons · Navya</title>
<link rel="icon" href="/img/navya-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/coupon.css">
<style>
  @page { size: A4 portrait; margin: 0; }
  body { margin: 0; background: #E9E1D8; font-family: 'Albert Sans', system-ui, sans-serif; color: #2B1B14; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 20px; background: #2B1B14; color: #fff; }
  .bar h1 { font-size: 16px; margin: 0 12px 0 0; }
  .bar label { font-size: 13px; display: flex; gap: 6px; align-items: center; opacity: .9; }
  .bar select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 0; }
  .bar .grow { flex: 1; }
  .bar .url { font-size: 12px; opacity: .75; }
  .bar .url b { color: #FFD36B; }
  .bar button { font: inherit; font-weight: 800; padding: 9px 18px; border-radius: 10px; border: 0; background: #F47216; color: #fff; cursor: pointer; }
  .bar a { color: #FFD36B; font-size: 13px; }
  .bar a.back { color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; padding: 8px 14px; border-radius: 10px; border: 1px solid #5A3A2B; }
  .bar a.back:hover { background: rgba(255,255,255,.08); }
  .sheets { padding: 24px 0 60px; display: grid; gap: 24px; justify-content: center; }
  .sheet { width: 210mm; height: 297mm; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 9mm 7mm; box-sizing: border-box;
    display: grid; grid-template-columns: repeat(2, 95mm); grid-template-rows: repeat(4, 64mm); gap: 6mm 6mm; justify-content: center; align-content: center; position: relative; }
  .cell { position: relative; z-index: 0; }
  /* crop marks — kept *behind* the coupon: with "Background graphics" off Chrome
     paints this layer as a white box, which used to cover the coupon. */
  .cell::before { content: ''; position: absolute; inset: -2.2mm; pointer-events: none; z-index: -1;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    background:
      linear-gradient(#bbb, #bbb) 0 0 / 2mm .2mm no-repeat, linear-gradient(#bbb, #bbb) 0 0 / .2mm 2mm no-repeat,
      linear-gradient(#bbb, #bbb) 100% 0 / 2mm .2mm no-repeat, linear-gradient(#bbb, #bbb) 100% 0 / .2mm 2mm no-repeat,
      linear-gradient(#bbb, #bbb) 0 100% / 2mm .2mm no-repeat, linear-gradient(#bbb, #bbb) 0 100% / .2mm 2mm no-repeat,
      linear-gradient(#bbb, #bbb) 100% 100% / 2mm .2mm no-repeat, linear-gradient(#bbb, #bbb) 100% 100% / .2mm 2mm no-repeat; }
  .sheet-foot { position: absolute; bottom: 3mm; left: 0; right: 0; text-align: center; font-size: 2.4mm; color: #aaa; }
  .empty { text-align: center; padding: 80px 16px; font-size: 18px; }
  @media (max-width: 700px) {
    .bar { position: static; padding: 10px 12px; gap: 8px; }
    .bar h1 { flex: 1 1 100%; order: -1; font-size: 15px; }
    .bar .back { order: -2; }
    .bar .grow { display: none; }
    .bar .url { flex: 1 1 100%; }
    .bar button { flex: 1 1 100%; }
    .sheets { padding: 12px 0 40px; gap: 12px; }
  }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheets { padding: 0; gap: 0; zoom: 1 !important; }
    .sheet { box-shadow: none; break-after: page; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="/admin#coupons" title="Back to Coupons &amp; Print">← Back</a>
    <h1 id="title">Loading…</h1>
    <label>Design
      <select id="theme">
        <option value="">Campaign default</option>
        <option value="orange">Tempting Orange</option>
        <option value="chocolate">Rich Chocolate</option>
        <option value="festive">Festive Red</option>
      </select>
    </label>
    <label>Coupons
      <select id="which">
        <option value="unused">Unused only</option>
        <option value="all">All in batch</option>
      </select>
    </label>
    <span class="grow"></span>
    <span class="url">QR opens: <b id="baseUrl"></b> · <a href="/admin#settings" target="_blank">change</a></span>
    <button id="printBtn" disabled>Print</button>
  </div>
  <div class="sheets" id="sheets"></div>

<script src="/admin/coupon.js"></script>
<script>
(async () => {
  const id = location.pathname.split('/').pop();
  const r = await fetch('/api/admin/batches/' + id);
  if (r.status === 401) { location.href = '/admin'; return; }
  const { batch, coupons, public_url } = await r.json();
  document.getElementById('title').textContent = `${batch.name} — ${batch.count} coupons`;
  document.getElementById('baseUrl').textContent = public_url;
  const treats = ['/img/cake.webp', '/img/cookies.webp', '/img/desserts.webp', '/img/bread.webp', '/img/savouries.webp', '/img/snacks.webp'];
  const qs = new URLSearchParams(location.search);
  if (qs.get('theme')) document.getElementById('theme').value = qs.get('theme');

  function render() {
    const theme = document.getElementById('theme').value || batch.theme;
    const which = document.getElementById('which').value;
    const list = coupons.filter(c => which === 'all' ? c.status !== 'void' : c.status === 'new');
    const host = document.getElementById('sheets');
    if (!list.length) { host.innerHTML = '<div class="empty">No unused coupons left in this batch.</div>'; return; }
    let html = '';
    for (let p = 0; p < list.length; p += 8) {
      html += '<div class="sheet">';
      for (const c of list.slice(p, p + 8)) {
        html += '<div class="cell">' + renderCoupon({
          code: c.code, serial: c.serial, theme, headline: batch.headline, subline: batch.subline,
          expires_on: batch.expires_on, baseUrl: public_url, treat: treats[(c.serial - 1) % treats.length],
        }) + '</div>';
      }
      html += `<div class="sheet-foot">${batch.name} · page ${p / 8 + 1} of ${Math.ceil(list.length / 8)} · cut along the marks</div></div>`;
    }
    host.innerHTML = html;
    const btn = document.getElementById('printBtn');
    btn.disabled = true; btn.textContent = 'Preparing…';
    const imgs = [...host.querySelectorAll('img')];
    Promise.all(imgs.map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })))
      .then(() => document.fonts.ready)
      .then(() => { btn.disabled = false; btn.textContent = `Print ${list.length} coupons`; });
  }
  document.getElementById('theme').onchange = render;
  document.getElementById('which').onchange = render;
  document.getElementById('printBtn').onclick = () => window.print();
  // On phones/tablets shrink the A4 sheets to fit the screen (screen only — print stays full size).
  function fit() {
    const sheets = document.getElementById('sheets');
    const k = Math.min(1, (document.documentElement.clientWidth - 16) / (210 * 96 / 25.4));
    sheets.style.zoom = k < 1 ? k : '';
  }
  window.addEventListener('resize', fit);
  fit();
  render();
})();
</script>
</body>
</html>
