<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2B160D">
<title>Navya Scratch & Win · Admin</title>
<link rel="icon" href="/img/navya-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">

<body>
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <img src="/img/navya-logo.svg" alt="Navya Bake Shop">
      <h1>Scratch &amp; Win</h1>
      <p>Coupon admin · sign in to continue</p>
      <input class="input" type="password" name="password" placeholder="Admin password" autocomplete="current-password" autofocus>
      <p class="err" id="loginErr"></p>
      <button class="btn primary block">Sign in</button>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand">
        <img src="/img/navya-logo.svg" alt="Navya">
        <div><b>Scratch &amp; Win</b><small>Coupon admin</small></div>

        <a href="#coupons" data-r="coupons" title="Coupons & Print" aria-label="Coupons &amp; Print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4Z"/><path d="M14 5v14" stroke-dasharray="2 3"/></svg><span>Coupons &amp; Print</span></a>

      <div class="side-foot">
        Navya Bake Shop · Angamaly
        <button id="logout">Sign out</button>
      </div>

  <div id="modalRoot"></div>
