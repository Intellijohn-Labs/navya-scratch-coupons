<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213D">
<meta name="robots" content="noindex">
<title>Super Admin · Genuine Draw</title>
<link rel="icon" href="/img/platform-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/super/super.css">
</head>
<body class="super">
  <div id="login" class="login hidden">
    <div class="login-fx" aria-hidden="true"><b></b><b></b><b></b><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <form class="login-card" id="loginForm">
      <img src="/img/platform-icon.svg" alt="" class="login-icon">
      <h1>Super Admin</h1>
      <p>Genuine Draw platform owner</p>
      <label class="lf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input class="input has-eye" type="password" name="password" placeholder="Super admin password" autocomplete="current-password" autofocus><button type="button" class="lf-eye" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
      <p class="err" id="loginErr"></p>
      <button class="btn primary block">Sign in</button>
      <div class="lg-foot"><img src="/img/platform-icon.svg" alt="">Secured by <b>Genuine Draw</b></div>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand">
        <img src="/img/platform-icon.svg" alt="" style="background:none;padding:0;height:40px">
        <div><b>Genuine Draw</b><small>Super Admin</small></div>
      </div>
      <nav class="nav" id="nav">
        <a href="#merchants" data-r="merchants" title="Merchants" aria-label="Merchants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg><span>Merchants</span></a>
        <a href="#approvals" data-r="approvals" title="Approvals" aria-label="Approvals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Approvals</span></a>
        <a href="#complaints" data-r="complaints" title="Complaints" aria-label="Complaints"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M12 8v4M12 15.5v.01"/></svg><span>Complaints</span></a>
        <a href="#activity" data-r="activity" title="Activity log" aria-label="Activity log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span>Activity log</span></a>
        <a href="#account" data-r="account" title="My account" aria-label="My account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>My account</span></a>
      </nav>
      <div class="side-foot">
        Platform owner
        <button id="logout">Sign out</button>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <div id="modalRoot"></div>

<script>document.querySelectorAll('.lf-eye').forEach(b => b.addEventListener('click', () => {
  const i = b.parentElement.querySelector('input'); const show = i.type === 'password';
  i.type = show ? 'text' : 'password'; b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); b.style.opacity = show ? '1' : ''; i.focus();
}));</script>
<script src="/admin/coupon.js"></script>
<script src="/super/super.js"></script>
</body>
</html>
