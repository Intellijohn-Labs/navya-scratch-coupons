<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213D">
<title>Shop sign-in · Genuine Draw</title>
<link rel="icon" href="/img/platform-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .alt { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .alt a { color: #14213D; font-weight: 700; }
</style>
</head>
<body>
  <div class="login platform">
    <div class="login-fx" aria-hidden="true"><b></b><b></b><b></b><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <form class="login-card" id="f">
      <img src="/img/platform-icon.svg" alt="" class="login-icon">
      <h1>Shop sign-in</h1>
      <p>Enter your username and we'll take you to your shop's own address.</p>
      <label class="lf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18M9 20v-6h6v6"/></svg><input class="input" name="username" placeholder="Your username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required></label>
      <p class="err" id="err"></p>
      <button class="btn primary block">Continue</button>
      <p class="alt">Platform owner? <a href="/super">Super Admin sign-in</a></p>
      <div class="lg-foot"><img src="/img/platform-icon.svg" alt="">Secured by <b>Genuine Draw</b></div>
    </form>
  </div>
<script>
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const card = e.target, btn = card.querySelector('.btn.primary'), err = document.getElementById('err');
    err.textContent = '';
    btn.classList.add('loading');
    const u = card.username.value.trim();
    const r = await fetch('/api/find-shop?username=' + encodeURIComponent(u)).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (r && r.ok) { card.classList.add('leaving'); setTimeout(() => { location.href = d.url; }, 380); return; }
    btn.classList.remove('loading');
    err.textContent = r ? (d.error || 'Something went wrong') : 'No connection. Please try again.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  });
</script>
</body>
</html>
