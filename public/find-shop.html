<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213D">
<title>Shop sign-in · Genuine Draw</title>
<link rel="icon" href="/img/platform-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .login-card .btn.primary { background: linear-gradient(135deg, #2A3F6E, #14213D); box-shadow: 0 8px 18px -10px rgba(20, 33, 61, .8); }
  .alt { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .alt a { color: #14213D; font-weight: 700; }
  .login { background: radial-gradient(circle at 80% 0%, #C9D6F5, transparent 45%), radial-gradient(circle at 0% 100%, #F6E3B4, transparent 45%), #F3F5FA; }
</style>
</head>
<body>
  <div class="login">
    <form class="login-card" id="f">
      <img src="/img/platform-icon.svg" alt="" class="login-icon">
      <h1>Shop sign-in</h1>
      <p>Enter your username and we'll take you to your shop's own address.</p>
      <input class="input" name="username" placeholder="Your username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
      <p class="err" id="err"></p>
      <button class="btn primary block">Continue</button>
      <p class="alt">Platform owner? <a href="/super">Super Admin sign-in</a></p>
    </form>
  </div>
<script>
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    const u = e.target.username.value.trim();
    const r = await fetch('/api/find-shop?username=' + encodeURIComponent(u));
    const d = await r.json().catch(() => ({}));
    if (r.ok) location.href = d.url;
    else err.textContent = d.error || 'Something went wrong';
  });
</script>
</body>
</html>
